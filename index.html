<section id="meeting" hidden role="tabpanel" aria-labelledby="tab-meeting"><h2>工作要求</h2><p class="muted">按负责人展开查看各节点的交付内容。</p><div id="requirements"></div><p class="note">报名截止为 12/1 23:59:59，作品提交截止为 12/9 23:59:59。<a href="https://render.alipay.com/p/yuyan/180022670000190962/index.html#/activity-rules">赛事细则</a></p></section></main>
<dialog id="taskDialog"><button class="btn dialog-close" id="closeDialog">关闭</button><div id="dialogBody"></div></dialog><script>
const tasks = [{"id": "D1", "o": "design", "n": "模板与生成规则定稿", "e": "11-10", "a": "确定首发版式、字体与装饰风格，整理换图、文案和生成规则。"}, {"id": "D2", "o": "design", "n": "设计效果与导出验收", "e": "11-13", "a": "检查真实素材适配、抠图、文字遮挡与导出文件效果。"}, {"id": "D3", "o": "design", "n": "用户反馈改进完成", "e": "11-27", "a": "根据首轮反馈优化模板和生成效果，整理可复用的修改规则。"}, {"id": "D4", "o": "design", "n": "展示案例准备完成", "e": "12-04", "a": "整理能展示完整创作流程的成品案例与演示素材。"}, {"id": "T1", "o": "tech", "n": "技术方案与上线条件确认", "e": "11-08", "a": "核对网站部署、支付开通条件、生成流程和交付方案。"}, {"id": "T2", "o": "tech", "n": "付费试运行上线", "e": "11-14", "a": "验收从预览、付款到下载的完整路径，满足上线条件后开放试用。"}, {"id": "T3", "o": "tech", "n": "稳定版本与功能冻结", "e": "11-30", "a": "修复用户反馈的关键问题，冻结新增功能，转入稳定性检查。"}, {"id": "T4", "o": "tech", "n": "上线回归检查完成", "e": "12-05", "a": "核对新用户制作、支付、导出和异常恢复，做好评审期间运行准备。"}, {"id": "G1", "o": "growth", "n": "报名与收款开通推进", "e": "11-08", "a": "确认报名负责人及收款账号，提交所需材料并跟进开通状态。"}, {"id": "G2", "o": "growth", "n": "首轮用户验证复盘", "e": "11-22", "a": "组织试用，汇总使用、付款、交付与未完成原因，确定下一轮优先级。"}, {"id": "G3", "o": "growth", "n": "首版参赛作品提交", "e": "11-23", "a": "技术确认正式体验入口后提交作品，核对材料并跟进审核。"}, {"id": "G4", "o": "growth", "n": "最终材料与审核核对", "e": "12-07", "a": "确认提交内容与线上版本一致，核对必填项与审核状态。"}];
const names = {design:'产品 / 设计',tech:'技术',growth:'用户 / 商业'};
const $ = id => document.getElementById(id);
const day = date => (Date.parse('2026-'+date+'T00:00:00Z')-Date.parse('2026-11-06T00:00:00Z'))/86400000;
function render(){
 let head='<thead><tr><th class="taskcell">负责人 / 节点</th>';
 for(let i=0;i<34;i++){
  const date=new Date(Date.UTC(2026,10,6+i));
  head+='<th class="day">'+(i===0||date.getUTCDate()===1?(date.getUTCMonth()+1)+'/':'')+date.getUTCDate()+'</th>';
 }
 let rows='';
 for(const owner of Object.keys(names)){
  if($('ownerFilter').value!=='all'&&$('ownerFilter').value!==owner)continue;
  rows+='<tr class="band '+owner+'"><th colspan="35"><span class="band-dot"></span>'+names[owner]+'</th></tr>';
  for(const task of tasks.filter(t=>t.o===owner)){
   const date=task.e.replace('-','/');
   rows+='<tr class="task-line"><td class="taskcell"><button class="task-name" data-task="'+task.id+'">'+task.n+'</button><span class="mobile-date">'+date+'</span></td><td colspan="34"><div class="track"><button class="deadline '+owner+'" style="left:'+((day(task.e)+.5)/34*100)+'%" data-task="'+task.id+'" aria-label="'+task.n+'，截止 '+date+'"><span class="diamond"></span><span class="due-label">'+date+'</span></button></div></td></tr>';
  }
 }
 $('gantt').innerHTML=head+'</tr></thead><tbody>'+rows+'</tbody>';
 $('requirements').innerHTML=Object.keys(names).map(owner=>'<h3 class="req-owner">'+names[owner]+'</h3>'+tasks.filter(t=>t.o===owner).map(t=>'<details class="requirement"><summary><span>'+t.n+'</span><time>'+t.e.replace('-','/')+'</time></summary><p>'+t.a+'</p></details>').join('')).join('');
}
function activate(id){
 document.querySelectorAll('.tab').forEach(button=>button.setAttribute('aria-selected',String(button.dataset.tab===id)));
 document.querySelectorAll('section[role=tabpanel]').forEach(section=>section.hidden=section.id!==id);
}
document.querySelectorAll('.tab').forEach(button=>button.addEventListener('click',()=>activate(button.dataset.tab)));
$('ownerFilter').addEventListener('change',render);
$('gantt').addEventListener('click',event=>{
 const button=event.target.closest('[data-task]');if(!button)return;
 const task=tasks.find(t=>t.id===button.dataset.task);
 $('dialogBody').innerHTML='<span class="tag '+task.o+'">'+names[task.o]+'</span><h2 style="margin-top:18px">'+task.n+'</h2><p class="due-heading">截止 '+task.e.replace('-','/')+'</p><p>'+task.a+'</p>';
 $('taskDialog').showModal();
});
$('closeDialog').addEventListener('click',()=>$('taskDialog').close());
$('printBtn').addEventListener('click',()=>window.print());
$('saveBtn').addEventListener('click',()=>{
 const html='<!doctype html>'+document.documentElement.outerHTML;
 const url=URL.createObjectURL(new Blob([html],{type:'text/html;charset=utf-8'}));
 const anchor=document.createElement('a');anchor.href=url;anchor.download='同好制所-项目排期.html';anchor.click();
 setTimeout(()=>URL.revokeObjectURL(url),1000);
});
render();
</script></body></html>
